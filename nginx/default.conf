server {
    listen 80 default_server;

    # root не указан: код внутри app-контейнера, nginx не имеет доступа к /data.
    # Все запросы идут через unix-сокет в PHP-FPM. Конфиг единый для dev и prod.

    index index.php;

    # FPM status/ping — обрабатываются встроенным обработчиком FPM,
    # должны быть ДО regex location ~ \.php$
    location ~ ^/(fpm-status|fpm-ping)$ {
        access_log off;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /data/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # PHP-файлы — основной обработчик
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /data/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param X-Real-IP $remote_addr;
        fastcgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Всё остальное — через контроллер Slim
    location / {
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /data/public/index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
    }
}
