upstream php-fpm-backend {
    least_conn;
    #   ip_hash;
    server php_fpm1:9000;
    server php_fpm2:9000;
}

server {
    listen 80;
    server_name _;
    root /var/www/mysite.local;
    index index.php;

    location ~* .(jpg|jpeg|gif|png|css|js|ico|html)$ {
        access_log off;
        expires max;
    }

    #   Единая точка входа. Все запросы к веб-серверу будут направляться в корневую директорию
    #   хоста ( / ) в файл index.php
    location / {
        try_files $uri /index.php$is_args$args;
    }

    #   Обращения к php-fpm
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-fpm-backend;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        internal;
    }

    #   при попытке прямого обращения к файлам *.php будем отдавать 404 ошибку
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
