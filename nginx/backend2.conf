upstream php_fpm_pool {
    random;
    server php_fpm_1:9000;
    server php_fpm_2:9000;
    server php_fpm_3:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/php_course;
    index index.php;

    error_page 404 = /index.php;

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|html)$ {
        access_log off;
        expires max;
    }

    location / {
        try_files $uri /index.php$is_args$args;
        add_header X-Backend $hostname always;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_fpm_pool;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param BACKEND_HOST $hostname;

        internal;
        fastcgi_keep_conn off;
    }

    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
