version: '3.8'

services:
  redis:
    image: redis:7.4.7-alpine
    expose:
      - "6379"
    container_name: "redis_session_container"
  php-fpm_balance_1:
    build:
      context: ./php
    volumes:
      - ./php:/var/www/html
    environment:
      PHP_SESSION_SAVE_HANDLER: redis
      PHP_SESSION_SAVE_PATH: "tcp://redis:6379"
    expose:
      - "9000"
    depends_on:
      - redis
    container_name: php-fpm_container_b1

  nginx_container_1:
    image: nginx:1.29.3-alpine
    expose:
      - "80"
    volumes:
      - ./nginx/default_container_1.conf:/etc/nginx/conf.d/default.conf:ro
      - ./php:/var/www/html:ro
    depends_on:
      - php-fpm_balance_1
    container_name: nginx_container_1  

  php-fpm_balance_2:
    build:
      context: ./php
    volumes:
      - ./php:/var/www/html
    environment:
      PHP_SESSION_SAVE_HANDLER: redis
      PHP_SESSION_SAVE_PATH: "tcp://redis:6379"
    expose:
      - "9000"
    depends_on:
      - redis
    container_name: php-fpm_container_b2

  nginx_container_2:
    image: nginx:1.29.3-alpine
    expose:
      - "80"
    volumes:
      - ./nginx/default_container_2.conf:/etc/nginx/conf.d/default.conf:ro
      - ./php:/var/www/html:ro
    depends_on:
      - php-fpm_balance_2
    container_name: nginx_container_2  

  nginx_balancer:
    image: nginx:1.29.3-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/balancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nginx_container_2
      - nginx_container_1
    container_name: nginx_balancer_container