version: '3'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: hw10/app
    container_name: hw10-app
    volumes:
      - ./app:/var/www/html/app
      - ./docker/php/php-socket:/var/run/php
    networks:
      - otus-network

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: hw10/nginx
    container_name: hw10-nginx
    volumes:
      - ./app:/var/www/html/app
      - ./docker/php/php-socket:/var/run/php
    ports:
      - "80:80"
      - "443:443"
    networks:
      - otus-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: hw10-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - ./docker/elasticsearch/elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - otus-network


networks:
  otus-network:
    driver: bridge
