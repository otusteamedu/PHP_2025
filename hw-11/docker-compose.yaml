version: '3'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: hw11/app
    container_name: hw11-app
    volumes:
      - ./app:/var/www/html/app
    networks:
      - otus-network

  redis:
    image: redis:8.2.2
    container_name: hw11-redis
    ports:
      - "6379:6379"
    networks:
      - otus-network


networks:
  otus-network:
    driver: bridge
