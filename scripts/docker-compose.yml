services:
    gateway:
        build: haproxy
        container_name: gateway
        ports:
            - '80:80'
        volumes:
            - './haproxy/gateway.cfg:/usr/local/etc/haproxy/haproxy.cfg:r'
        networks:
            - main

    green_nginx:
        image: nginx:alpine
        container_name: greennginx
        volumes:
            - './nginx/green.conf:/etc/nginx/conf.d/default.conf:r'
            - './releases/green/app:/app:delegated'
        networks:
            main:
                ipv4_address: 172.20.0.10
        depends_on:
            - green
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/"]
            interval: 5s
            timeout: 10s
            retries: 3

    blue_nginx:
        image: nginx:alpine
        container_name: bluenginx
        volumes:
            - './nginx/blue.conf:/etc/nginx/conf.d/default.conf:r'
            - './releases/blue/app:/app:delegated'
        networks:
            main:
                ipv4_address: 172.20.0.11
        depends_on:
            - blue
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/"]
            interval: 5s
            timeout: 10s
            retries: 3

    blue:
        build: docker
        container_name: blue
        restart: unless-stopped
        environment:
            COLOR: blue
        env_file:
            - ./releases/blue/.env
        volumes:
            - ./releases/blue/app:/app:delegated
        working_dir: /app
        networks:
            main:
                ipv4_address: 172.20.0.20

    green:
        build: docker
        container_name: green
        restart: unless-stopped
        environment:
            COLOR: green
        env_file:
            - ./releases/green/.env
        volumes:
            - ./releases/green/app:/app:delegated
        working_dir: /app
        networks:
            main:
                ipv4_address: 172.20.0.21

    ## Пример подключения БД (раскомментировать при необходимости):
    # postgres:
    #     image: postgres:17
    #     container_name: postgres
    #     restart: always
    #     environment:
    #         POSTGRES_DB: app
    #         POSTGRES_USER: prod
    #         POSTGRES_PASSWORD: prod
    #     volumes:
    #         - ./postgres_data:/var/lib/postgresql/data
    #     networks:
    #         main:
    #             ipv4_address: 172.20.0.30

networks:
    main:
        driver: bridge
        ipam:
            config:
                - subnet: 172.20.0.0/24

