services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: myapp/nginx
    container_name: ${CONTAINER_NAME}
    ports:
      - "80:80"
    volumes:
      - ./code:/data/mysite.local
    depends_on:
      - app
      - postgres
      - rabbitmq
      - swagger-ui
    networks:
      - app-network

  app:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    env_file:
      - .env
    image: myapp/php
    container_name: app
    volumes:
      - ./code:/data/mysite.local
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - app-network

  postgres:
    image: postgres:latest
    container_name: postgres
    volumes:
      - ./postgres/data:/var/lib/postgresql
      - ./postgres/dump:/dump
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_LOCAL_PORT}:${POSTGRES_PORT}"
    env_file:
      - .env
    networks:
      - app-network

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - ./code/openapi.yaml:/openapi/openapi.yaml:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
