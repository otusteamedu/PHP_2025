services:
  # Входной балансировщик HTTP → backend nginx
  php_course_nginx:
    image: nginx:alpine
    container_name: php_course_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/logs:/var/log/nginx:delegated
    depends_on:
      - backend_nginx_1
      - backend_nginx_2
      - backend_nginx_3
    networks:
      - php_course_network

  # Backend nginx 1
  backend_nginx_1:
    image: nginx:alpine
    container_name: backend_nginx_1
    volumes:
      - ./code:/var/www/php_course
      - ./nginx/backend1.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/logs:/var/log/nginx:delegated
    depends_on:
      - php_fpm_1
      - php_fpm_2
      - php_fpm_3
    networks:
      - php_course_network

  # Backend nginx 2
  backend_nginx_2:
    image: nginx:alpine
    container_name: backend_nginx_2
    volumes:
      - ./code:/var/www/php_course
      - ./nginx/backend2.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/logs:/var/log/nginx:delegated
    depends_on:
      - php_fpm_1
      - php_fpm_2
      - php_fpm_3
    networks:
      - php_course_network

  # Backend nginx 3
  backend_nginx_3:
    image: nginx:alpine
    container_name: backend_nginx_3
    volumes:
      - ./code:/var/www/php_course
      - ./nginx/backend3.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php_fpm_1
      - php_fpm_2
      - php_fpm_3
    networks:
      - php_course_network

  # Контейнер 1 с PHP-FPM
  php_fpm_1:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    container_name: 'php_fpm_1'
    volumes:
      - ./code:/var/www/php_course   
    networks:
      - php_course_network
    depends_on:
      - redis

  # Контейнер 2 с PHP-FPM
  php_fpm_2:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    container_name: 'php_fpm_2'
    volumes:
      - ./code:/var/www/php_course
    networks:
      - php_course_network
    depends_on:
      - redis

  # Контейнер 3 с PHP-FPM
  php_fpm_3:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    container_name: 'php_fpm_3'
    volumes:
      - ./code:/var/www/php_course
    networks:
      - php_course_network
    depends_on:
      - redis

  #Контейнер с Redis
  redis:
    image: redis:7-alpine
    container_name: php_course_redis    
    volumes:
      - redis-data:/data
    networks:
      - php_course_network

#Docker Networks
networks:
  php_course_network:
    driver: bridge

volumes:
  redis-data:
    driver: local
