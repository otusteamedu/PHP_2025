version: "3.9"

services:
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - .:/var/app:ro,cached
        networks:
            - app-network
        depends_on:
            - php-fpm

    php-fpm:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        volumes:
            - .:/var/app:rw
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/dev.ini
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - PHP_IDE_CONFIG=serverName=docker-app
        networks:
            - app-network
        depends_on:
            - rabbitmq

    rabbitmq:
        image: rabbitmq:4.1.4-management
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - app-network

    mailhog:
        image: mailhog/mailhog:latest
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - app-network

volumes:
    rabbitmq_data:

networks:
    app-network:
        driver: bridge