version: '3'
services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: myapp/nginx
    container_name: nginx
    ports:
      - "80:80"
    volumes:
       - ./code:/data/mysite.local
       - ./docker/nginx/logs:/var/log/nginx:delegated
       - php-socket:/var/run
    networks:
      - app-network
    depends_on:
      - app

  app:
    build:
      context: ./docker/fpm
      dockerfile: Dockerfile
    image: myapp/php 
    container_name: app
    volumes:
       - ./code:/data/mysite.local
       - php-socket:/var/run
    networks:
      - app-network
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

  worker:
    build:
      context: ./docker/fpm
      dockerfile: Dockerfile
    image: myapp/php
    container_name: worker
    volumes:
      - ./code:/data/mysite.local
    working_dir: /data/mysite.local
    command: ["php", "bin/report-worker.php"]
    environment:
      RABBITMQ_HOST: rabbitmq
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    networks:
      - app-network
    depends_on:
      - rabbitmq
      - mailhog
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  php-socket:
    driver: local
  rabbitmq-data:
    driver: local
