version: "3.9"

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/app:ro,cached
    networks:
      - app-network
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/app:rw
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/dev.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
        - PHP_IDE_CONFIG=serverName=docker-app
    networks:
      - app-network
    depends_on:
      - redis
      - mongodb

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=events_db
    networks:
      - app-network


volumes:
  mongodb_data:
  redis_data:

networks:
  app-network:
    driver: bridge