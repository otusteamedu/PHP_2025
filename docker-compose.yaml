# в этом блоке мы описываем контейнеры, которые будут запускаться
name: homework 19
services:

  nginx:
    build:
      context: ./compose/hw19/nginx
      dockerfile: Dockerfile
    image: hw/nginx
    container_name: nginxhw19
    # проброс портов
    ports:
      - "80:80"
    volumes:
       - .:/data/mysite.local
    depends_on:
      rabbitmq:
        condition: service_healthy
      phpnew:
         condition: service_started
    networks:
      - default_network

  phpnew:
    # Если нет секции build, то система будет искать образ в репозиториях
    build:
      context: ./compose/hw19/php
      dockerfile: Dockerfile
    image: hw/php # имя будущего образа
    container_name: phpnew19 # имя контейнера после запуска
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME}
    volumes:
       - .:/data/mysite.local
    depends_on:
      rabbitmq:
        condition: service_healthy
      php-receiver:
        condition: service_started
    networks:
      - default_network

  php-receiver:
    # Если нет секции build, то система будет искать образ в репозиториях
    build:
      context: ./compose/hw19/php
      dockerfile: Dockerfile
    image: hw/php # имя будущего образа
    container_name: php-receiver-hw19 # имя контейнера после запуска
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME}
    command:
      - /bin/sh
      - -c
      - |
        cd mysite.local
        composer install
        php receiver.php
    volumes:
      - .:/data/mysite.local
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - default_network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./compose/hw19/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - ./compose/hw19/rabbitmq/rabbitmq.config:/etc/rabbitmq/rabbitmq.config
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default_network

networks:
  default_network:
    driver: bridge
