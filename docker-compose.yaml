version: "3.9"

services:
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - .:/var/app:ro,cached
        networks:
            - app-network
        depends_on:
            - php-fpm

    php-fpm:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        volumes:
            - .:/var/app:rw
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/dev.ini
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - PHP_IDE_CONFIG=serverName=docker-app
        networks:
            - app-network
        depends_on:
            - rabbitmq
            - postgres

    rabbitmq:
        image: rabbitmq:4.1.4-management
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - app-network

    postgres:
        image: postgres:17.7-alpine3.23
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgresql_data:/var/lib/postgresql/data
        restart: unless-stopped
        networks:
            - app-network

volumes:
    rabbitmq_data:
    postgresql_data:

networks:
    app-network:
        driver: bridge