# Маршрутизатор blue-green
# $active_backend позволяет nginx стартовать даже при недоступном upstream -
# реcолвится при запросе, а не при запуске.
# switch-slot.sh подменяет "blue-webserver" -> "green-webserver" через sed.

server {
    listen 8080;
    server_name _;

    # Docker DNS: без resolver nginx не реcолвит имена контейнеров и возвращает 502.
    # 127.0.0.11 — встроенный DNS Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Активный backend — switch-slot.sh подменяет слот через sed
    set $active_backend blue-webserver;

    location / {
        proxy_pass http://$active_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/(fpm-status|fpm-ping)$ {
        access_log off;
        proxy_pass http://$active_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /switch-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
