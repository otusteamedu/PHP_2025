version: "3.9"

services:
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        container_name: nginx_hw14
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - .:/var/app:ro,cached
        networks:
            - app-network
        depends_on:
            - php-fpm

    php-fpm:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        container_name: php_hw14
        volumes:
            - .:/var/app:rw
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/dev.ini
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - PHP_IDE_CONFIG=serverName=docker-app
        networks:
            - app-network

networks:
    app-network:
        driver: bridge