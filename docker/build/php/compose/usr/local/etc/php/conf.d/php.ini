; Required timezone
date.timezone = UTC

; General settings
memory_limit = 128M
post_max_size = 96M
upload_max_filesize = 64M

; Security
expose_php = Off

; Debug
error_reporting = E_ALL
display_errors = On

[debug]
xdebug.mode = debug,profile,coverage
xdebug.output_dir = /var/www/html
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
