
services:
    balancer:
        image: nginx:1-alpine
        container_name: balancer
        ports:
            - "80:80"
        volumes:
            # Создадим этот конфиг на следующем шаге
            - ./docker/balancer/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/logs:/var/log/nginx:delegated
            - /dev/null:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - nginx-1
            - nginx-2
        networks:
            - app-network
    #контейне с Nginx
    nginx-1:
        build:
            context: ./docker/nginx
            dockerfile: Dockerfile
            args:
                UID: ${CUR_UID}
                GID: ${CUR_GID}
        # user: "${CUR_UID:-1000}:${CUR_GID:-1000}"
        depends_on:
            - php-fpm-1
        # проброс портов
        ports:
            - "${HTTP_PORT_1:-8081}:8080"
            - "${HTTPS_PORT_1:-8444}:443"
        environment:
            - INSTANCE_ID_1=1
            - INSTANCE_ID_2=2
        volumes:
            - ./app_old:/var/www/html
            # - ./docker/nginx/hosts:/etc/nginx/conf.d
            - ./docker/nginx/hosts:/etc/nginx/templates 
            - php_socket:/var/run/php
            - ./nginx/logs:/var/log/nginx:delegated
            - /dev/null:/etc/nginx/conf.d/default.conf:ro
        # command: ["nginx", "-g", "daemon off; pid /tmp/nginx.pid;"]
        networks:
            - app-network
    nginx-2:
        build:
            context: ./docker/nginx
            dockerfile: Dockerfile
            args:
                UID: ${CUR_UID}
                GID: ${CUR_GID}
        # user: "${CUR_UID:-1000}:${CUR_GID:-1000}"
        depends_on:
            - php-fpm-2
        # проброс портов
        ports:
            - "${HTTP_PORT_2:-8082}:8080"
            - "${HTTPS_PORT_2:-8445}:443"
        environment:
            - INSTANCE_ID_1=1
            - INSTANCE_ID_2=2
        volumes:
            - ./app_old:/var/www/html
            # - ./docker/nginx/hosts:/etc/nginx/conf.d
            - ./docker/nginx/hosts:/etc/nginx/templates 
            - php_socket:/var/run/php
            - ./nginx/logs:/var/log/nginx:delegated
            - /dev/null:/etc/nginx/conf.d/default.conf:ro
        # command: ["nginx", "-g", "daemon off; pid /tmp/nginx.pid;"]
        networks:
            - app-network
    # PHP-FPM 1
    php-fpm-1:
        build:
            context: ./docker/fpm
            dockerfile: Dockerfile
            args:
                - REDIS_PASSWORD=${REDIS_PASSWORD}
        environment:
            - APP_ENV=${APP_ENV}
            - PHP_IDE_CONFIG=${PHP_IDE_CONFIG}
            - XDEBUG_MODE=${XDEBUG_MODE}
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
            - POSTGRES_HOST=${POSTGRES_HOST}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - INSTANCE_ID=1
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        user: "www-data:www-data"
        volumes:
            - ./app_old:/var/www/html
            - php_socket:/var/run/php
            - ./docker/fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./docker/fpm/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf
            - ./docker/php/session.ini.template:/usr/local/etc/php/conf.d/session.ini.template
        command: >
            sh -c "cp /usr/local/etc/php-fpm.d/www.conf /tmp/www.conf && 
                   sed -i 's/\$${INSTANCE_ID}/1/g' /tmp/www.conf && 
                   php-fpm -y /tmp/www.conf"
        networks:
            - app-network

    # PHP-FPM 2
    php-fpm-2:
        build:
            context: ./docker/fpm
            dockerfile: Dockerfile
            args:
                - REDIS_PASSWORD=${REDIS_PASSWORD}
        environment:
            - APP_ENV=${APP_ENV}
            - PHP_IDE_CONFIG=${PHP_IDE_CONFIG}
            - XDEBUG_MODE=${XDEBUG_MODE}
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
            - POSTGRES_HOST=${POSTGRES_HOST}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - INSTANCE_ID=2
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        user: "www-data:www-data"
        volumes:
            - ./app_old:/var/www/html
            - php_socket:/var/run/php
            - ./docker/fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./docker/fpm/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf
            - ./docker/php/session.ini.template:/usr/local/etc/php/conf.d/session.ini.template
        command: >
            sh -c "cp /usr/local/etc/php-fpm.d/www.conf /tmp/www.conf && 
                   sed -i 's/\$${INSTANCE_ID}/2/g' /tmp/www.conf && 
                   php-fpm -y /tmp/www.conf"
        networks:
            - app-network
    memcached:
        build:
            context: ./docker/memcached
            dockerfile: Dockerfile
            args:
                memcached_image: ${MEMCACHED_IMAGE}
        user: "memcache"
        networks: 
            - app-network
        ports: 
            - "${MEMCACHED_PORT}:11211"
        command: '-m 512'
    redis:
        build:
            context: ./docker/redis
            dockerfile: Dockerfile
            args:
                redis_image: ${REDIS_IMAGE}
        user: "redis"
        networks: 
            - app-network
        ports: 
            - "${REDIS_PORT}:6379"
#Docker Networks
networks:
    app-network:
        driver: bridge

volumes:
    postgres_data:
    php_socket:
