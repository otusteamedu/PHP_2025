apiVersion: apps/v1
kind: Deployment
metadata:
    name: rabbitmq
spec:
    replicas: 1
    selector:
        matchLabels:
            app: rabbitmq
    template:
        metadata:
            labels:
                app: rabbitmq
        spec:
            containers:
                -   name: rabbitmq
                    image: rabbitmq:4.2-management
                    resources:
                        requests:
                            memory: "128Mi"
                            cpu: "100m"
                        limits:
                            memory: "256Mi"
                            cpu: "500m"
                    ports:
                        -   containerPort: 5672
                            name: amqp
                        -   containerPort: 15672
                            name: management
                    env:
                        -   name: RABBITMQ_DEFAULT_USER
                            valueFrom:
                                secretKeyRef:
                                    name: rabbitmq
                                    key: RABBITMQ_DEFAULT_USER
                        -   name: RABBITMQ_DEFAULT_PASS
                            valueFrom:
                                secretKeyRef:
                                    name: rabbitmq
                                    key: RABBITMQ_DEFAULT_PASS
---
apiVersion: v1
kind: Service
metadata:
    name: rabbitmq
spec:
    selector:
        app: rabbitmq
    ports:
        -   name: amqp
            port: 5672
            targetPort: 5672
        -   name: management
            port: 15672
            targetPort: 15672
