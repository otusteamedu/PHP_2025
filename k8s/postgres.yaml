apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres
spec:
    serviceName: postgres
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                -   name: postgres
                    image: postgres:17.5-trixie
                    resources:
                        requests:
                            memory: "256Mi"
                            cpu: "250m"
                        limits:
                            memory: "512Mi"
                            cpu: "500m"
                    imagePullPolicy: IfNotPresent
                    ports:
                        -   containerPort: 5432
                    env:
                        -   name: POSTGRES_DB
                            value: otus
                        -   name: POSTGRES_USER
                            value: otus
                        -   name: POSTGRES_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: postgres
                                    key: POSTGRES_PASSWORD
                    volumeMounts:
                        -   name: postgres
                            mountPath: /var/lib/postgresql/data
    volumeClaimTemplates:
        -   metadata:
                name: postgres
            spec:
                accessModes:
                    - ReadWriteOnce
                resources:
                    requests:
                        storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
    name: postgres
spec:
    type: ClusterIP
    selector:
        app: postgres
    ports:
        -   port: 5432
            targetPort: 5432
