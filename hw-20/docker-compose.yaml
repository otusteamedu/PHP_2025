version: '3'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: hw19/app
    container_name: hw20-app
    working_dir: /var/www/html/app
    volumes:
      - ./app:/var/www/html/app
      - ./docker/php/php-socket:/var/run/php
    networks:
      - otus-network

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: hw19/nginx
    container_name: hw20-nginx
    volumes:
      - ./app:/var/www/html/app
      - ./docker/php/php-socket:/var/run/php
    ports:
      - "80:80"
      - "443:443"
    networks:
      - otus-network

  postgres:
    image: postgres:15.5
    container_name: hw20-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: hw20
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - otus-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - ./docker/rabbitmq/rabbitmq.config:/etc/rabbitmq/rabbitmq.config
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - otus-network


networks:
  otus-network:
    driver: bridge
