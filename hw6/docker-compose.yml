services:
    postgres-hw6:
        image: ${POSTGRES_IMAGE:-postgres:12.4-alpine}  # Используем переменную из .env
        user: "postgres:postgres"
        container_name: ${POSTGRES_HOST:-postgres}
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-hw6_database}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            # Дополнительные настройки для производительности
            POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
            PGDATA: /var/lib/postgresql/data/pgdata
        ports: 
            - "${HOST_MACHINE}:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data  # Постоянное хранение данных
            - ./sql/01-tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
            - ./sql/02-datasets.sql:/docker-entrypoint-initdb.d/02-datasets.sql:ro
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-hw6_database}"]
            interval: 10s
            timeout: 5s
            retries: 5
networks:
    app-network:
        driver: bridge

volumes:
    postgres_data: