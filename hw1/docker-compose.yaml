services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: app_hw1
    volumes:
      - ./:/app
    networks:
      - app-test

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: nginx_hw1
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/default.conf
      - ./:/app:ro
    depends_on:
      - app
    networks:
      - app-test
  db:
    image: mysql:8.0
    container_name: mysql_hw1
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./docker/dbdata:/var/lib/mysql
    networks:
      - app-test
  redis:
    image: redis:8.2
    container_name: redis_hw1
    volumes:
      - ./docker/redisdata:/data
    networks:
      - app-test
  memcached:
    image: memcached:1.6
    container_name: mem_hw1
    networks:
      - app-test
networks:
  app-test:
    driver: bridge
