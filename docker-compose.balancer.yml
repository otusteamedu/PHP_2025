version: '3.9'

services:

  php_1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/app
      - php_1_socket:/var/run/php

  php_2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/app
      - php_2_socket:/var/run/php

  front_nginx:
    image: nginx:stable
    ports:
      - "${NGINX_PUBLISHED_PORT}:80"
    volumes:
      - ./docker/nginx/balancer/front.conf:/etc/nginx/conf.d/default.conf
      - ./var/log/nginx_front:/var/log/nginx
    depends_on:
      - nginx_1
      - nginx_2

  nginx_1:
    image: nginx:stable
    working_dir: /app
    volumes:
      - ./:/app
      - ./docker/nginx/balancer/backend.conf:/etc/nginx/conf.d/default.conf
      - ./var/log/nginx_1:/var/log/nginx
      - php_1_socket:/var/run/php_1
      - php_2_socket:/var/run/php_2
    depends_on:
      - php_1
      - php_2

  nginx_2:
    image: nginx:stable
    working_dir: /app
    volumes:
      - ./:/app
      - ./docker/nginx/balancer/backend.conf:/etc/nginx/conf.d/default.conf
      - ./var/log/nginx_2:/var/log/nginx
      - php_1_socket:/var/run/php_1
      - php_2_socket:/var/run/php_2
    depends_on:
      - php_1
      - php_2

  postgres:
    image: postgres:${POSTGRES_VERSION:-15}
    ports:
      - '${DB_PUBLISHED_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data

  memcached:
    image: memcached:latest
    ports:
      - '${MEMCACHED_PUBLISHED_PORT}:11211'

  redis:
    image: redis:latest
    ports:
      - '${REDIS_PUBLISHED_PORT}:6379'
    volumes:
      - redis_data:/data

  elasticsearch_init:
    build:
      context: .
      dockerfile: docker/elasticsearch/Dockerfile
    environment:
      - ELASTIC_HOST=${ELASTIC_HOST}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_NODE_NAME=${ELASTIC_NODE_NAME}
      - ELASTIC_HTTP_CERT_PASSWORD=${ELASTIC_HTTP_CERT_PASSWORD}
      - ELASTIC_TRANSPORT_CERT_PASSWORD=${ELASTIC_TRANSPORT_CERT_PASSWORD}
    volumes:
      - ./docker/elasticsearch/config/certs:/usr/share/elasticsearch/config/certs
      - ./docker/elasticsearch/config/keystore:/usr/share/elasticsearch/config/keystore
    healthcheck:
      test: [ "CMD", "test", "-f", "/tmp/elasticsearch_init_complete" ]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 60s

  elasticsearch:
    image: elasticsearch:9.2.5
    ports:
      - '9200:9200'
      - '9300:9300'
    environment:
      - cluster.name=docker-cluster
      - network.host=0.0.0.0
      - discovery.type=single-node
      - node.name=${ELASTIC_NODE_NAME}
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - bootstrap.memory_lock=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    entrypoint:
      - /bin/tini
      - --
      - bash
      - -c
      - |
        if [ ! -f /usr/share/elasticsearch/config/elasticsearch.keystore ]; then
          cp /usr/share/elasticsearch/config/keystore/elasticsearch.keystore /usr/share/elasticsearch/config;
        fi
        exec /usr/local/bin/docker-entrypoint.sh;
    mem_limit: 4g
    cpus: 2.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./docker/elasticsearch/config/certs:/usr/share/elasticsearch/config/certs
      - ./docker/elasticsearch/config/keystore:/usr/share/elasticsearch/config/keystore
      - ./docker/elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - es_data:/usr/share/elasticsearch/data
    depends_on:
      elasticsearch_init:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD", "bash", "-c",
        "curl -f --insecure -u ${ELASTIC_USER}:${ELASTIC_PASSWORD} https://localhost:9200/_cluster/health"
      ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  php_1_socket:
  php_2_socket:
  pg_data:
  redis_data:
  es_data:
