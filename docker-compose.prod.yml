services:
  app:
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ./:/var/www/html:ro
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache

  web:
    restart: always
    volumes:
      - ./:/var/www/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  db:
    ports: []

  redis:
    ports: []

volumes:
  laravel_storage:
  laravel_cache:
