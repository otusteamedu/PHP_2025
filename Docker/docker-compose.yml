version: '3'

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: myapp/nginx2025
    container_name: ${CONTAINER_NAME_NGINX}
    ports:
      - '${NGINX_PORT}:80'
      - '443:443'
    volumes:
      - ./code:/data/mysite.local
      - ./exchange/php-socket:/var/run/php
    networks:
      - app-network


  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    image: myapp/php2025
    container_name: ${CONTAINER_NAME_PHP}
    restart: always
    environment:
      - "REDIS_HOST=${REDIS_HOST}"
      - "MEMCACHED_HOST=${MEMCACHED_HOST}"
    volumes:
      - ./code:/data/mysite.local
      - ./exchange/php-socket:/var/run/php
    networks:
      - app-network


  redis:
      image: redis:latest
      container_name: ${CONTAINER_NAME_REDIS}
      restart: always
      ports:
        - "6379:6379"
      networks:
        - app-network

  memcached:
      image: memcached:latest
      container_name: ${CONTAINER_NAME_MEMCACHED}
      restart: always
      networks:
        - app-network

  mysql:
      image: mysql:latest
      container_name: ${CONTAINER_NAME_MYSQL}
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      volumes:
        - ./exchange/db_data:/var/lib/mysql
      ports:
        - '${MYSQL_PORT}:3306'

      networks:
        - app-network

networks:
  app-network:
    driver: bridge