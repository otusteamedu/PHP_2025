stages:
  - build
  - test
  - deploy
  - verify
  - switch
  - post-verify
  - cleanup

variables:
  APP_NAME: mkd-bot
  DEPLOY_DIR: /opt/mkd-bot
  INTERNAL_REGISTRY: localhost:5050

build:app:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  tags: [mkdbot]
  before_script:
    - INTERNAL_IMAGE="${CI_REGISTRY_IMAGE/$CI_REGISTRY/$INTERNAL_REGISTRY}"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $INTERNAL_REGISTRY
  script:
    - INTERNAL_IMAGE="${CI_REGISTRY_IMAGE/$CI_REGISTRY/$INTERNAL_REGISTRY}"
    - TARGET_SLOT=$(if [ "$(cat $DEPLOY_DIR/.active-slot)" = "blue" ]; then echo "green"; else echo "blue"; fi)
    - docker build --target prod -f fpm/Dockerfile -t $INTERNAL_IMAGE:prod-$CI_COMMIT_SHORT_SHA .
    - docker push $INTERNAL_IMAGE:prod-$CI_COMMIT_SHORT_SHA
    - echo "TARGET_SLOT=$TARGET_SLOT" > build.env
  artifacts:
    reports:
      dotenv: build.env

test:
  stage: test
  rules:
  - if: $CI_COMMIT_BRANCH == "main"
  tags: [mkdbot]
  needs: [build:app]
  before_script:
  - INTERNAL_IMAGE="${CI_REGISTRY_IMAGE/$CI_REGISTRY/$INTERNAL_REGISTRY}"
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $INTERNAL_REGISTRY
  script:
  - INTERNAL_IMAGE="${CI_REGISTRY_IMAGE/$CI_REGISTRY/$INTERNAL_REGISTRY}"
  - docker build --target test -f fpm/Dockerfile -t $INTERNAL_IMAGE:test-$CI_COMMIT_SHORT_SHA .
  - docker run --rm --entrypoint php $INTERNAL_IMAGE:test-$CI_COMMIT_SHORT_SHA vendor/bin/phpunit --testsuite=Unit,Feature --colors=never

deploy:slot:
  stage: deploy
  tags: [mkdbot]
  needs: [build:app, test]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
  - INTERNAL_IMAGE="${CI_REGISTRY_IMAGE/$CI_REGISTRY/$INTERNAL_REGISTRY}"
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $INTERNAL_REGISTRY
  - rm -f /dev/shm/mkd-bot.env $DEPLOY_DIR/.env
  - bash deploy/scripts/render-env.sh deploy/env.template /dev/shm/mkd-bot.env
  - ln -sf /dev/shm/mkd-bot.env $DEPLOY_DIR/.env
  - trap "rm -f /dev/shm/mkd-bot.env $DEPLOY_DIR/.env" EXIT SIGTERM SIGHUP
  script:
    - INTERNAL_IMAGE="${CI_REGISTRY_IMAGE/$CI_REGISTRY/$INTERNAL_REGISTRY}"
    - export CI_REGISTRY_IMAGE=$INTERNAL_IMAGE
    - export APP_VERSION=prod-$CI_COMMIT_SHORT_SHA
    - bash deploy/scripts/deploy-slot.sh ${TARGET_SLOT}

deploy:migrations:
  stage: deploy
  tags: [mkdbot]
  needs: [build:app, deploy:slot, test]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $INTERNAL_REGISTRY
  script:
    - docker exec ${TARGET_SLOT}-app php /data/bin/migrate.php
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

verify:health:
  stage: verify
  tags: [mkdbot]
  needs: [build:app, deploy:migrations]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $INTERNAL_REGISTRY
  script:
    - cd $DEPLOY_DIR
    - bash deploy/scripts/health-check.sh ${TARGET_SLOT}
    - echo "+++ $TARGET_SLOT is healthy and ready for switch"

switch:traffic:
  stage: switch
  tags: [mkdbot]
  needs: [build:app, verify:health]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  before_script:
  - INTERNAL_IMAGE="${CI_REGISTRY_IMAGE/$CI_REGISTRY/$INTERNAL_REGISTRY}"
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $INTERNAL_REGISTRY
  - rm -f /dev/shm/mkd-bot.env $DEPLOY_DIR/.env
  - bash deploy/scripts/render-env.sh deploy/env.template /dev/shm/mkd-bot.env
  - ln -sf /dev/shm/mkd-bot.env $DEPLOY_DIR/.env
  - trap "rm -f /dev/shm/mkd-bot.env $DEPLOY_DIR/.env" EXIT SIGTERM SIGHUP
  script:
    - INTERNAL_IMAGE="${CI_REGISTRY_IMAGE/$CI_REGISTRY/$INTERNAL_REGISTRY}"
    - export CI_REGISTRY_IMAGE=$INTERNAL_IMAGE
    - export APP_VERSION=prod-$CI_COMMIT_SHORT_SHA
    - cd $DEPLOY_DIR
    - bash deploy/scripts/switch-slot.sh ${TARGET_SLOT}
    - echo "+++ Traffic switched to ${TARGET_SLOT}"

verify:after-switch:
  stage: post-verify
  tags: [mkdbot]
  needs: [build:app, switch:traffic]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $INTERNAL_REGISTRY
  script:
    - |
      BODY=$(curl -s http://localhost:8080/ready)
      STATUS=$(echo "$BODY" | grep -o '"status":"ok"' || true)
      if [ -z "$STATUS" ]; then
        echo "--- Post-switch health check failed! Response: $BODY"
        exit 1
      fi
    - echo "+++ Post-switch verification passed"

cleanup:old-slot:
  stage: cleanup
  tags: [mkdbot]
  needs: [build:app, verify:after-switch]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $INTERNAL_REGISTRY
  script:
    - cd $DEPLOY_DIR
    - |
      ACTIVE=$(cat $DEPLOY_DIR/.active-slot)
      if [ "$ACTIVE" = "blue" ]; then
        INACTIVE="green"
      else
        INACTIVE="blue"
      fi
      bash deploy/scripts/cleanup-slot.sh $INACTIVE
    - echo "+++ Old slot cleaned up"
