version: '3.8'

services:
  app-nginx:
    image: nginx:alpine
    container_name: app_nginx
    ports:
      - "18080:80"
    volumes:
      - ./code:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - php1
      - php2
      - php3
    networks:
      - app_net

  app-redis:
    image: redis:alpine
    container_name: app_redis
    networks:
      - app_net

  php1:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: app_php1
    volumes:
      - ./code:/var/www/html
    networks:
      - app_net

  php2:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: app_php2
    volumes:
      - ./code:/var/www/html
    networks:
      - app_net

  php3:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: app_php3
    volumes:
      - ./code:/var/www/html
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
