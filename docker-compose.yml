services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-hw5
    restart: on-failure
    ports:
      - "8000:80"
      - "443:443"
    volumes:
      - ./code:/data/webserver
      - ./nginx/logs:/var/log/nginx:delegated

    working_dir: /var/www/webserver

    networks:
      - app5-network
    depends_on:
      - php-fpm

  php-fpm:
    container_name: php-fpm
    build:
      context: ./fpm
      dockerfile: Dockerfile
    expose:
      - "9000"
    volumes:
      - ./code:/data/webserver
    networks:
      - app5-network
    depends_on:
      - db
      - rabbitmq
      - mailhog
    environment: # Added environment variables
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}

  db:
    image: postgres:13-alpine
    container_name: postgres-server
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./code/db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app5-network

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    image: redis:alpine
    container_name: redis-server
    volumes:
      - ./redis/data:/data
    networks:
      - app5-network

  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/logs:/var/log/rabbitmq
    networks:
      - app5-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}

  mailhog:
    build:
      context: ./mailhog
      dockerfile: Dockerfile
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    networks:
      - app5-network

networks:
  app5-network:
    driver: bridge
volumes:
  php-sock:
