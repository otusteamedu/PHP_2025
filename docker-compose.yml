version: '3.8'
services:
  app:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: myapp/php
    container_name: app
    volumes:
       - ./code:/data/mysite.local
       - ./php-socket:/var/run/php 
    networks:
      - app-network

  webserver:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: myapp/nginx
    container_name: webserver
    ports:
      - "80:80"
      - "443:443"
    volumes:
       - ./code:/data/mysite.local
       - ./php-socket:/var/run/php
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./tmp/db:/var/lib/mysql  
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./redisdata:/data
    networks:
      - app-network

  memcached:
    image: memcached:1.6-alpine
    command: memcached -m 64m
    networks:
      - app-network
networks:
  app-network:
    driver: bridge