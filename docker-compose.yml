services:
  postgres:
    image: postgres:17
    ports:
      - 5432:5432
    container_name: 'postgres'
    working_dir: /app
    restart: always
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg_dump:/app/dump
      - pg_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  app:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: ${APP_NAME}/php
    container_name: app
    volumes:
      - ${WWW_ROOT_DIR}:/data/${APP_DOMAIN}
      - php_socket:/var/run/php-fpm
      - ./logs:/var/log/app
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - app-network

  webserver:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${APP_NAME}/nginx
    container_name: webserver
    ports:
      - "80:80"
    volumes:
      - ${WWW_ROOT_DIR}:/data/${APP_DOMAIN}
      - php_socket:/var/run/php-fpm
    depends_on:
      - app
    networks:
      - app-network

volumes:
  php_socket:
    driver: local
  rabbitmq_data:
    driver: local
  pg_dump:
    driver: local
  pg_data:
    driver: local

networks:
  app-network:
    driver: bridge
