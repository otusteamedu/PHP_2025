volumes:
  mysql_data:
    driver: local
  redis1_data:
    driver: local
  redis2_data:
    driver: local
  redis3_data:
    driver: local

services:
  nginx_main:
    image: nginx:stable
    container_name: "nginx_main"
    ports:
      - "80:80"
    volumes:
      - ./nginx_main/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx_main:/var/log/nginx:delegated
    depends_on:
      - nginx1
      - nginx2
    networks:
      - app-network

  nginx1:
    image: nginx:stable
    container_name: "nginx1"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx1:/var/log/nginx:delegated
      - ${WWW_ROOT_DIR}:/var/www/${APP_DOMAIN}
    working_dir: /var/www/${APP_DOMAIN}
    depends_on:
      - php_fpm1
      - php_fpm2
    networks:
      - app-network

  nginx2:
    image: nginx:stable
    container_name: "nginx2"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx2:/var/log/nginx:delegated
      - ${WWW_ROOT_DIR}:/var/www/${APP_DOMAIN}
    working_dir: /var/www/${APP_DOMAIN}
    depends_on:
      - php_fpm1
      - php_fpm2
    networks:
      - app-network

  php_fpm1:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: ${APP_NAME}/php
    container_name: "php_fpm1"
    volumes:
      - ${WWW_ROOT_DIR}:/var/www/${APP_DOMAIN}
      - ./logs/php_fpm1:/var/log/php-fpm:delegated
    depends_on:
      - mysql
      - memcached
      - redis1
    networks:
      - app-network

  php_fpm2:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: ${APP_NAME}/php
    container_name: "php_fpm2"
    volumes:
      - ${WWW_ROOT_DIR}:/var/www/${APP_DOMAIN}
      - ./logs/php_fpm2:/var/log/php-fpm:delegated
    depends_on:
      - mysql
      - memcached
      - redis1
    networks:
      - app-network

  mysql:
    image: percona/percona-server:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql:delegated
      - ./mysql/my.cnf:/etc/my.cnf.d/my.cnf:ro
    networks:
      - app-network

  memcached:
    image: memcached
    container_name: memcached
    networks:
      - app-network

  redis1:
    image: redis
    container_name: redis1
    volumes:
      - redis1_data:/data
      - ./logs/redis1:/var/log/redis:delegated
      - ./redis/redis1.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - app-network

  redis2:
    image: redis
    container_name: redis2
    volumes:
      - redis2_data:/data
      - ./logs/redis2:/var/log/redis:delegated
      - ./redis/redis2.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      - redis1
    networks:
      - app-network

  redis3:
    image: redis
    container_name: redis3
    volumes:
      - redis3_data:/data
      - ./logs/redis3:/var/log/redis:delegated
      - ./redis/redis3.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      - redis1
    networks:
      - app-network

  sentinel1:
    image: redis
    container_name: sentinel1
    volumes:
      - ./redis_sentinel/sentinel1:/data
      - ./logs/sentinel1:/var/log/redis:delegated
    command: ["redis-server", "/data/sentinel.conf", "--sentinel"]
    depends_on:
      - redis1
      - redis2
      - redis3
    networks:
      - app-network

  sentinel2:
    image: redis
    container_name: sentinel2
    volumes:
      - ./redis_sentinel/sentinel2:/data
      - ./logs/sentinel2:/var/log/redis:delegated
    command: ["redis-server", "/data/sentinel.conf", "--sentinel"]
    depends_on:
      - redis1
      - redis2
      - redis3
    networks:
      - app-network

  sentinel3:
    image: redis
    container_name: sentinel3
    volumes:
      - ./redis_sentinel/sentinel3:/data
      - ./logs/sentinel3:/var/log/redis:delegated
    command: ["redis-server", "/data/sentinel.conf", "--sentinel"]
    depends_on:
      - redis1
      - redis2
      - redis3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
