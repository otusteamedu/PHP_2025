services:
    gitlab:
        image: gitlab/gitlab-ce:17.11.7-ce.0
        container_name: gitlab
        restart: always
        hostname: '192.168.1.39'
        environment:
            GITLAB_OMNIBUS_CONFIG: |
                external_url 'http://192.168.1.39:7778'
                gitlab_rails['gitlab_shell_ssh_port'] = 9022
                gitlab_rails['initial_root_password'] = 'fdgs3vDFS'
        ports:
            - '7778:7778'
            - '9022:22'
        volumes:
            - gitlab_config:/etc/gitlab
            - gitlab_logs:/var/log/gitlab
            - gitlab_data:/var/opt/gitlab
        shm_size: '256m'

    php-fpm:
        build: app/docker
        container_name: 'dp-php'
        volumes:
            - ./app:/app
        working_dir: /app

    nginx:
        image: nginx
        container_name: 'dp-nginx'
        working_dir: /app
        ports:
            - '29998:80'
        volumes:
            - ./app:/app
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/logs:/var/log/nginx:delegated
volumes:
    gitlab_config:
    gitlab_logs:
    gitlab_data:
