services:
  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  app:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: ${APP_NAME}/php
    container_name: app
    volumes:
      - ${WWW_ROOT_DIR}:/data/${APP_DOMAIN}
      - php_socket:/var/run/php-fpm
      - ./logs:/var/log/app
    depends_on:
      - rabbitmq
    networks:
      - app-network

  webserver:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${APP_NAME}/nginx
    container_name: webserver
    ports:
      - "80:80"
    volumes:
      - ${WWW_ROOT_DIR}:/data/${APP_DOMAIN}
      - php_socket:/var/run/php-fpm
    depends_on:
      - app
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - app-network

volumes:
  php_socket:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  app-network:
    driver: bridge
