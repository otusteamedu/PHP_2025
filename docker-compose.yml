services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    restart: always
    depends_on:
      - php-fpm
    networks:
      - app-network
  php-fpm:
    build:
      context: ./php
    volumes:
      - ./src:/var/www/html
    networks:
      - app-network

  redis:
    image: redis:latest
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
volumes:
  esdata:
    driver: local
