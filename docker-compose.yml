volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  php_socket:
    driver: local

services:
  app:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: ${APP_NAME}/php
    container_name: app
    volumes:
      - ${WWW_ROOT_DIR}:/data/${APP_DOMAIN}
      - php_socket:/var/run/php-fpm
    networks:
      - app-network

  webserver:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${APP_NAME}/nginx
    container_name: webserver
    ports:
      - "80:80"
    volumes:
      - ${WWW_ROOT_DIR}:/data/${APP_DOMAIN}
      - php_socket:/var/run/php-fpm
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: percona/percona-server:8.0
    container_name: db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  memcached:
    image: memcached:latest
    container_name: memcached
    ports:
      - "11211:11211"
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
