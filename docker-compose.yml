services:
    php:
        build:
            context: ./docker
            dockerfile: ./php/Dockerfile
        container_name: php-fpm-for-redis
        volumes:
            - ./:/app
        working_dir: /app
        env_file:
            - .env
        networks:
            - app-network
    redis:
        image: redis:latest
        container_name: redis
        command: redis-server --requirepass ${REDIS_PASSWORD}
        ports:
            - "6380:6379"
        volumes:
          - ./:/app
        working_dir: /app
        networks:
            - app-network
    redis-insight:
        image: redis/redisinsight:latest
        container_name: redis-insight
        ports:
            - "5540:5540"
        volumes:
            - redis-insight:/data
        depends_on:
            - redis
        networks:
            - app-network
volumes:
    redis-insight:
networks:
    app-network:
        driver: bridge