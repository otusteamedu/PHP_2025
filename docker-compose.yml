services:
  app:
    build: .
    container_name: reminder_bot_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - app-network
    depends_on:
      - mysql
    command: ["php-fpm"]

  cron:
    build: .
    container_name: reminder_bot_cron
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - app-network
    depends_on:
      - mysql
      - app
    command: >
      sh -c "
      mkdir -p /var/log &&
      echo '* * * * * /usr/local/bin/php /var/www/scripts/send_reminders.php >> /var/log/cron.log 2>&1' > /etc/crontabs/root &&
      crond -f -s
      "

  mysql:
    image: mysql:8.0
    container_name: reminder_bot_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: reminder_bot
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    ports:
      - "3307:3306"

  nginx:
    image: nginx:alpine
    container_name: reminder_bot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - app

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: