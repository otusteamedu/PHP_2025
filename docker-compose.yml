services:
  nginx:
    build:
      context: ./docker
      dockerfile: ./nginx/Dockerfile
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php_fpm
    networks:
      - app-network

  php_fpm:
    build:
      context: ./docker
      dockerfile: ./php/Dockerfile
    container_name: php_fpm
    volumes:
      - ./:/var/www
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - app-network

  postgres:
    image: postgres:18.4
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"

    volumes:
      - postgres-data-30-task:/var/lib/postgresql/data

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    networks:
      - app-network
volumes:
  postgres-data-30-task:
networks:
  app-network:
    driver: bridge
