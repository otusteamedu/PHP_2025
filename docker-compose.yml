services:

    nginx:
        build:
            context: .
            dockerfile: docker/build/nginx/Dockerfile
            args:
                UID: ${UID}
                GID: ${GID}
        volumes:
            - ./html:/var/www/html/:ro
        depends_on:
            - php
        networks:
            private:

    php:
        scale: 3
        build:
            context: .
            dockerfile: docker/build/php/Dockerfile
            args:
                UID: ${UID}
                GID: ${GID}
        volumes:
            - composer:/var/www/.composer/:rw
            - ./html:/var/www/html/:rw
        depends_on:
            - memcached
            - redis
            - postgres
        networks:
            private:

    memcached:
        image: memcached:1.6-trixie
        networks:
            private:

    redis:
        image: valkey/valkey:9.0-trixie
        volumes:
            - valkey:/data/:rw
        networks:
            private:

    postgres:
        image: postgres:18.0-trixie
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres:/var/lib/postgresql/:rw
        networks:
            private:

    centrifugo:
        image: centrifugo/centrifugo:v6.3
        volumes:
            - ./docker/containers/centrifugo/config.json:/centrifugo/config.json:ro
        command: centrifugo --config config.json
        ulimits:
            nofile:
                soft: 65535
                hard: 65535
        ports:
            -   target: 8000
                published: 8000
        networks:
            private:

volumes:
    composer:
        name: composer
    php-fpm-sock:
        name: otus-php-2025_php-fpm-sock
    valkey:
        name: otus-php-2025_valkey
    postgres:
        name: otus-php-2025_postgres

networks:
    private:
        name: otus-php-2025
        driver: bridge
