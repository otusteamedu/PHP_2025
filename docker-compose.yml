version: '3.8'

services:
  nginx:
    build:
      context: ./docker
      dockerfile: ./nginx/Dockerfile
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php_fpm
    networks:
      - app-network

  php_fpm:
    build:
      context: ./docker
      dockerfile: ./php/Dockerfile
    container_name: php_fpm
    volumes:
      - ./:/var/www
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - app-network
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    networks:
      - app-network
networks:
  app-network:
    driver: bridge