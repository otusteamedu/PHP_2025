services:
  postgres:
    image: postgres:17
    ports:
    - 5432:5432
    container_name: postgres
    working_dir: /app
    restart: always
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg_dump:/app/dump
      - pg_data:/var/lib/postgresql/data
    networks:
    - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_LOGIN}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    networks:
    - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: fpm/Dockerfile
      target: dev
    image: ${APP_NAME}/php
    container_name: app
    env_file: .env
    environment:
      SLOT_ROLE: active
      PG_HOST: postgres
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ${WWW_ROOT_DIR}:/data/
      - php_socket:/var/run/php-fpm
      - ./logs:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  webserver:
    image: nginx:stable
    container_name: webserver
    ports:
      - "80:80"
    volumes:
      # /data не монтируем — запросы уходят через FastCGI в app-контейнер
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - php_socket:/var/run/php-fpm
    depends_on:
      app:
        condition: service_started
    networks:
    - app-network

volumes:
  php_socket:
    driver: local
  rabbitmq_data:
    driver: local
  pg_dump:
    driver: local
  pg_data:
    driver: local

networks:
  app-network:
    driver: bridge
