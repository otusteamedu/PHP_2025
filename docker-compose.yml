services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - async-network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - async-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: async_api
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - async-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - async-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: php /var/www/html/src/Workers/Worker.php
    volumes:
      - ./:/var/www/html
    depends_on:
      - redis
      - mysql
    networks:
      - async-network

volumes:
  mysql-data:

networks:
  async-network:
    driver: bridge