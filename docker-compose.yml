volumes:
  pg_dump:
    driver: local
  pg_data:
    driver: local

services:
  postgres:
    image: postgres:17
    ports:
      - 5432:5432
    container_name: 'postgres'
    working_dir: /app
    restart: always
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg_dump:/app/dump
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
