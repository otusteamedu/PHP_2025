; Telegram Long Polling — получает обновления через getUpdates()
[program:telegram_longpoll_consumer]
command=php /data/bin/consumer-telegram-longpoll.php
autostart=true
autorestart=true
stdout_logfile=/var/log/app/consumer_telegram_longpoll.out.log
stderr_logfile=/var/log/app/consumer_telegram_longpoll.err.log
stopwaitsecs=10
