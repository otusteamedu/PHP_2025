; Периодическая отправка новостей — каждую минуту
[program:deliver_news_cron]
command=bash -c "while true; do php /data/bin/deliver-pending-news.php; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/var/log/app/deliver_news_cron.out.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
stderr_logfile=/var/log/app/deliver_news_cron.err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=3
stopwaitsecs=10
